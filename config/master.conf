# rsync-options - be aware : if you change somthing here, adapt the wrapper on the backup clients
rsync-options:
#        --modify-window=1
#        --bwlimit=5000
#        -vv

# ==============================================================================
# EXPIRE RULES (Retention Policy)
# ==============================================================================
# Defines how long historical backups are kept. Rules are evaluated from 
# top to bottom (First-Match). As soon as a backup date matches a time 
# window, that rule is applied and the evaluation loop stops.
#
# Syntax Examples:
#   +3 months   - Keeps all daily backups from the last 3 months.
#   2 months    - Deletes backups that are older than 2 months.
#   w/m 1       - Keeps only the first backup of each week/month.
#   never       - This specific backup will never be automatically deleted.
# ==============================================================================

expire:
# local expire overwrites global expire !!!
# cron like syntax: minute, hour, day of month, month, day of week
# be aware: conditions are checked, if a rule matches, then the appropriate expiry holds, no more checks!
# thus : if a rule is like * * * * * it always matches, i.e. all following rules are ignored

#examples:
# * * * * 1-5    +2 weeks    # Weekday backups (Mon-Fri) survive 2 weeks
# * * * * 6,7    +2 months   # Weekend backups (Sat-Sun) survive 2 months
# * * 1 * *      +1 year     # Monthly backups (1st of month) survive 1 year
# * 1 1 * *      never       # IGNORED BECAUS RULE ABOVE MATCCHES !!!!!
# * * 2 * *      +1 week
# * * * * 3      +1 day      # Wednesday backups are stored until Thursday....
# * * * * *      +3 day      # Standard...

# global expires:
 * 1 1 * *      never       # Backups from Jan. 1st are never deleted 
 * * 1 * *      +1 year     # Monthly backups (1st of month) survive 1 year
 * * * * 1-5    +1 weeks    # Weekday backups (Mon-Fri) survive 2 weeks
 * * * * 6      +1 months   # Weekend backups (Sat-Sun) survive 2 months
 * * * * *      +3 day      # Standard...

